all: true
dir: 'internal/test/mocks/{{.SrcPackageName}}'
filename: '{{.InterfaceName | snakecase}}_mock.go'
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: mocks
recursive: true
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/cthiagoodev/thiagoodev-portfolio/services/projects_sync:
    config:
      all: true
