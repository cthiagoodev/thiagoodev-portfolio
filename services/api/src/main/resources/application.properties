spring.application.name=api
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio}
spring.datasource.username=${POSTGRES_USER:portfolio}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.property-naming-strategy=SNAKE_CASE

github.api.repos-url=${GITHUB_API_REPOS_URL:https://api.github.com/users/cthiagoodev/repos}

