services:
  api:
    profiles:
      - prod
    build: .
    container_name: api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${PORT}:8080"

    depends_on:
      api-db:
        condition: service_healthy

  api-db:
    image: postgres:18.6
    container_name: api_db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  noco-db:
    image: nocodb/nocodb:latest
    container_name: noco_db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"

    ports:
      - "${NOCO_PORT}:8080"

    volumes:
      - noco_data:/usr/app/data

    depends_on:
      api-db:
        condition: service_healthy

volumes:
  postgres_data:
  noco_data:
